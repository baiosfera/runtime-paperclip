# ==============================================================================
# Zerops Platform Specification: Paperclip Governance & Spend Caps Watchdog
# Runtime: Ubuntu 26 / Node.js 26 (pnpm monorepo)
# SSoT: PostgreSQL 18 managed database + LocalStorage NVMe volume
# ==============================================================================
zerops:
  - setup: paperclip
    build:
      base: ubuntu/nodejs@26
      prepareCommands:
        - sudo apt-get update && sudo apt-get install -y --no-install-recommends ca-certificates curl git build-essential python3
        - sudo corepack enable || sudo npm install -g pnpm@latest
      buildCommands:
        - |
          mkdir -p /tmp/pw && cp zerops.yaml start.sh README.md bootstrap-org.ts /tmp/pw/
          rm -rf /tmp/paperclip-src && git init /tmp/paperclip-src
          git -C /tmp/paperclip-src remote add origin https://github.com/paperclipai/paperclip.git
          git -C /tmp/paperclip-src fetch --depth 1 origin 8e5959c759bb0f8a0b4c4489904cfa0525fa92d3
          git -C /tmp/paperclip-src checkout --detach FETCH_HEAD
          rm -rf /tmp/paperclip-src/.git
          cp -a /tmp/paperclip-src/. .
          cp /tmp/pw/zerops.yaml /tmp/pw/start.sh /tmp/pw/README.md /tmp/pw/bootstrap-org.ts .
          rm -rf /tmp/paperclip-src /tmp/pw
        - |
          node -e '
            const fs = require("fs");
            const p = "packages/paperclip-runner/package.json";
            const pkg = JSON.parse(fs.readFileSync(p, "utf8"));
            pkg.scripts["build:binary"] = "mkdir -p dist/bin && printf '\''#!/bin/sh\\nexit 0\\n'\'' > dist/bin/paperclip-runnerd && chmod +x dist/bin/paperclip-runnerd";
            fs.writeFileSync(p, JSON.stringify(pkg, null, 2) + "\n");
          '
        - pnpm install --no-frozen-lockfile
        - pnpm --filter @paperclipai/db build
        - |
          cat <<'EOF' > packages/db/src/ensure-db.ts
          import postgres from "postgres";

          const quoteIdent = (name: string): string => `"${name.replace(/"/g, "\"\"")}"`;

          const adminUrl = process.env.DATABASE_ADMIN_URL || process.env.DATABASE_URL;
          const appUrl = process.env.DATABASE_URL || adminUrl;
          if (!adminUrl || !appUrl) {
            throw new Error("Missing DATABASE_ADMIN_URL / DATABASE_URL");
          }

          const parsedApp = new URL(appUrl);
          const targetDb = parsedApp.pathname.replace(/^\//, "") || "paperclip";
          const appUser = decodeURIComponent(parsedApp.username || "");
          if (!/^[a-zA-Z0-9_-]+$/.test(targetDb)) {
            throw new Error(`Unsafe target database name: ${targetDb}`);
          }

          const sql = postgres(adminUrl, { max: 1 });
          try {
            const rows = await sql`SELECT 1 FROM pg_database WHERE datname = ${targetDb}`;
            if (rows.length === 0) {
              if (appUser) {
                await sql.unsafe(`CREATE DATABASE ${quoteIdent(targetDb)} OWNER ${quoteIdent(appUser)}`);
              } else {
                await sql.unsafe(`CREATE DATABASE ${quoteIdent(targetDb)}`);
              }
            } else if (appUser) {
              await sql.unsafe(`ALTER DATABASE ${quoteIdent(targetDb)} OWNER TO ${quoteIdent(appUser)}`);
            }
          } finally {
            await sql.end();
          }

          if (appUser) {
            const targetAdminUrl = new URL(adminUrl);
            targetAdminUrl.pathname = `/${targetDb}`;
            const dbSql = postgres(targetAdminUrl.toString(), { max: 1 });
            try {
              await dbSql.unsafe(`ALTER SCHEMA public OWNER TO ${quoteIdent(appUser)}`);
              await dbSql.unsafe(`GRANT ALL PRIVILEGES ON SCHEMA public TO ${quoteIdent(appUser)}`);
            } finally {
              await dbSql.end();
            }
          }
          EOF
        - ./node_modules/.bin/esbuild packages/db/src/ensure-db.ts --bundle --platform=node --format=esm --main-fields=module,main --banner:js="import { createRequire as __cr } from 'node:module'; const require = __cr(import.meta.url);" --outfile=packages/db/dist/ensure-db.mjs
        - ./node_modules/.bin/esbuild packages/db/src/migrate.ts --bundle --platform=node --format=esm --main-fields=module,main --banner:js="import { createRequire as __cr } from 'node:module'; const require = __cr(import.meta.url);" --external:embedded-postgres --outfile=packages/db/dist/migrate.mjs
        - cp bootstrap-org.ts packages/db/src/bootstrap-org.ts && ./node_modules/.bin/esbuild packages/db/src/bootstrap-org.ts --bundle --platform=node --format=esm --main-fields=module,main --banner:js="import { createRequire as __cr } from 'node:module'; const require = __cr(import.meta.url);" --outfile=packages/db/dist/bootstrap-org.mjs
        - pnpm --filter @paperclipai/ui build
        - pnpm --filter @paperclipai/plugin-sdk build
        - PAPERCLIP_TSC_EMIT_ONLY=1 pnpm --filter @paperclipai/server build
        - pnpm --filter @paperclipai/server build:runtime
        - sed -i 's|/build/source|/var/www|g' server/dist-runtime/*.mjs
        - rm -f server/dist-runtime/*.map server/dist/*.map
        - rm -rf docs doc tests ui/src ui/storybook packages/paperclip-runner server/src
      deployFiles:
        - .
      cache:
        - node_modules
    run:
      base: ubuntu/nodejs@26
      volume:
        hostname: localstorage
        mountPath: /mnt/localstorage
        readOnly: false
      ports:
        - port: 3100
          httpSupport: true
      initCommands:
        - sudo mkdir -p /mnt/localstorage/paperclip/storage /mnt/localstorage/paperclip/instances/default && sudo chown -R zerops:zerops /mnt/localstorage/paperclip && sudo chmod -R 777 /mnt/localstorage/paperclip
        - ln -sfn /mnt/localstorage/paperclip /home/zerops/.paperclip
        - |
          node --input-type=module -e '
            import net from "node:net";
            const urlStr = process.env.DATABASE_ADMIN_URL || process.env.DATABASE_URL;
            const u = new URL(urlStr);
            const host = u.hostname;
            const port = parseInt(u.port || "5432", 10);
            for (let i = 0; i < 30; i++) {
              const ok = await new Promise((resolve) => {
                const s = net.connect(port, host, () => { s.destroy(); resolve(true); });
                s.setTimeout(1500, () => { s.destroy(); resolve(false); });
                s.on("error", () => resolve(false));
              });
              if (ok) process.exit(0);
              await new Promise((r) => setTimeout(r, 1000));
            }
            console.error(`PostgreSQL not reachable at ${host}:${port} after 30s`);
            process.exit(1);
          '
        - node packages/db/dist/ensure-db.mjs
        - node packages/db/dist/migrate.mjs
      envVariables:
        PORT: "3100"
        HOST: "0.0.0.0"
        NODE_ENV: "production"
        SERVE_UI: "true"
        DATABASE_ADMIN_URL: "postgresql://${database_superUser}:${database_superUserPassword}@${database_hostname}:${database_port}/${database_dbName}"
        DATABASE_URL: "postgresql://${database_user}:${database_password}@${database_hostname}:${database_port}/paperclip"
        BETTER_AUTH_SECRET: ${PAPERCLIP_BETTER_AUTH_SECRET}
        PAPERCLIP_TOOL_ACTION_SIGNING_SECRET: ${PAPERCLIP_SIGNING_SECRET}
        PAPERCLIP_SECRETS_MASTER_KEY_FILE: "/mnt/localstorage/paperclip/instances/default/secrets.key"
        PAPERCLIP_STORAGE_PROVIDER: "local_disk"
        PAPERCLIP_STORAGE_LOCAL_DIR: "/mnt/localstorage/paperclip/storage"
        PAPERCLIP_HOME: "/mnt/localstorage/paperclip"
        PAPERCLIP_DEPLOYMENT_MODE: "authenticated"
        PAPERCLIP_DEPLOYMENT_EXPOSURE: "public"
        PAPERCLIP_BIND: "lan"
        PAPERCLIP_AUTH_BASE_URL_MODE: "explicit"
        PAPERCLIP_AUTH_PUBLIC_BASE_URL: "${zeropsSubdomain}"
        PAPERCLIP_PUBLIC_URL: "${zeropsSubdomain}"
        BETTER_AUTH_URL: "${zeropsSubdomain}"
        BETTER_AUTH_TRUSTED_ORIGINS: "${zeropsSubdomain}"
        PAPERCLIP_AUTH_RATE_LIMIT_ENABLED: "false"
        PAPERCLIP_HTTP_ADAPTER_PRIVATE_ENDPOINT_ALLOWLIST: "http://pidev:3000,http://hermes:8000,http://zcp:8080"
        # PROJECT_NAME, BIFROST_MASTER_VK, PAPERCLIP_ADMIN_EMAIL, PAPERCLIP_ADMIN_PASSWORD
        # are inherited directly from Project Shared Vault without self-shadowing
        HERMES_GATEWAY_URL: "http://hermes:8000"
      start: bash start.sh
      healthCheck:
        httpGet:
          port: 3100
          path: /api/health
